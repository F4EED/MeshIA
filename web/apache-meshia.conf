# MeshIA — portail LAN derriere Apache (port 80).
# Pas d'HTTPS, pas d'ouverture Internet. Flask ecoute 127.0.0.1:8765.
# Activer : a2enmod proxy proxy_http headers && a2enconf meshia && systemctl reload apache2

ProxyRequests Off
ProxyPreserveHost On
ProxyPass /meshia http://127.0.0.1:8765/meshia
ProxyPassReverse /meshia http://127.0.0.1:8765/meshia
